<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — AGUSTINA</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>AGUSTINA</h1>
    <p>Panel de administración</p>
    <div class="form-group" style="margin-bottom:12px">
      <label>Contraseña</label>
      <input type="password" id="pwd-input" placeholder="••••••••" />
    </div>
    <div class="alert alert--err" id="login-err">Contraseña incorrecta</div>
    <button class="btn btn--primary" style="width:100%" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- PANEL -->
<div id="admin-panel" style="display:none">

  <div class="admin-header">
    <h1>AGUSTINA — Admin</h1>
    <span>Panel de productos</span>
  </div>

  <div class="admin-body">

    <div class="tabs">
      <button class="tab active" onclick="switchTab('agregar')">➕ Agregar producto</button>
      <button class="tab" onclick="switchTab('lista')">📋 Mis productos</button>
    </div>

    <!-- TAB: AGREGAR -->
    <div class="tab-panel active" id="tab-agregar">
      <p class="section-title">Nuevo producto</p>

      <div class="card">
        <div class="alert alert--ok" id="ok-msg">✓ Producto guardado correctamente</div>
        <div class="alert alert--err" id="err-msg">Hubo un error al guardar</div>

        <div class="form-grid">

          <div class="form-group full">
            <label>Nombre del producto *</label>
            <input type="text" id="f-name" placeholder="Ej: Taza Stitch" />
          </div>

          <div class="form-group">
            <label>Precio (ARS) *</label>
            <input type="number" id="f-price" placeholder="Ej: 9500" min="0" />
          </div>

          <div class="form-group">
            <label>Categoría *</label>
            <select id="f-cat">
              <option value="">— Elegir —</option>
              <option value="indumentaria">Indumentaria</option>
              <option value="maquillaje">Maquillaje</option>
              <option value="skincare">Skincare</option>
              <option value="tazas">Tazas</option>
              <option value="botellas-y-vasos">Botellas y vasos</option>
              <option value="regaleria">Regalería</option>
              <option value="necesers">Necesers</option>
              <option value="marroquineria">Marroquinería</option>
              <option value="accesorios">Accesorios</option>
              <option value="giftcards">🎁 Gift Cards</option>
            </select>
          </div>

          <div class="form-group">
            <label>Subcategoría</label>
            <select id="f-sub">
              <option value="">— Ninguna —</option>
              <option value="tazas">Tazas</option>
              <option value="botellas-y-vasos">Botellas y vasos</option>
              <option value="libreria">Librería</option>
              <option value="para-el-cabello">Para el cabello</option>
              <option value="bijou">Bijou</option>
              <option value="llaveros">Llaveros</option>
              <option value="acero-quirurgico">Acero quirúrgico</option>
            </select>
          </div>

          <div class="form-group">
            <label>Precio en efectivo (ARS) <span style="color:#aaa;font-weight:400">— opcional</span></label>
            <input type="number" id="f-price-efectivo" placeholder="Ej: 8500" min="0" />
          </div>

          <div class="form-group full">
            <label>Descripción <span style="color:#aaa;font-weight:400">— opcional</span></label>
            <textarea id="f-descripcion" placeholder="Ej: Taza de cerámica con diseño exclusivo, 350ml. Ideal para regalar." rows="3" style="resize:vertical;min-height:70px"></textarea>
          </div>

          <div class="form-group full">
            <label>Imágenes del producto * <span style="color:#aaa;font-weight:400">(primera = principal)</span></label>
            <input type="file" id="f-img-file" accept="image/*" multiple style="display:none" />
            <div class="upload-zone" id="upload-zone" onclick="document.getElementById('f-img-file').click()">
              📷 Hacé click para subir fotos (podés elegir varias a la vez)
            </div>
            <div id="img-previews" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"></div>
            <small style="color:#aaa;font-size:12px;margin-top:4px">JPG o PNG. Se suben automáticamente a Supabase.</small>
          </div>

        </div>

        <div class="form-actions">
          <button class="btn btn--primary" id="btn-save" onclick="saveProduct()">Guardar producto</button>
          <button class="btn btn--ghost" onclick="clearForm()">Limpiar</button>
        </div>
      </div>
    </div>

    <!-- TAB: LISTA -->
    <div class="tab-panel" id="tab-lista">

      <!-- Barra de búsqueda y filtros -->
      <div class="list-toolbar">
        <input type="text" id="search-input" placeholder="🔍 Buscar por nombre..." oninput="filterList()" />
        <select id="filter-cat" onchange="filterList()">
          <option value="">Todas las categorías</option>
          <option value="indumentaria">Indumentaria</option>
          <option value="maquillaje">Maquillaje</option>
          <option value="skincare">Skincare</option>
          <option value="necesers">Necesers</option>
          <option value="marroquineria">Marroquinería</option>
          <option value="regaleria">Regalería</option>
          <option value="tazas">Tazas</option>
          <option value="botellas-y-vasos">Botellas y vasos</option>
          <option value="accesorios">Accesorios</option>
          <option value="giftcards">🎁 Gift Cards</option>
        </select>
        <select id="filter-estado" onchange="filterList()">
          <option value="">Todos</option>
          <option value="activo">Activos</option>
          <option value="inactivo">Inactivos</option>
        </select>
        <span id="list-count" class="list-count"></span>
      </div>

      <div id="product-list" class="product-list">
        <div class="loading">Cargando...</div>
      </div>
    </div>

  </div>
</div>

<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
